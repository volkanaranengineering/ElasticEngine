<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="460" viewBox="0 0 1250 460"><rect width="1250" height="460" fill="#f6f9fb"/><style>text{font-family:Arial;fill:#16354a}.b{fill:#e0f1ec;stroke:#267e72;stroke-width:2}.l{stroke:#267e72;stroke-width:3;fill:none}</style><text x="30" y="40" font-size="25">CNT pulley battery — 100 kWh delivered / 100 kW shaft</text><rect class="b" x="30" y="80" width="290" height="155" rx="10"/><text x="48" y="112" font-size="20">200 storage cartridges</text><text x="48" y="145" font-size="16">Short rope segments, shared guides</text><text x="48" y="173" font-size="16">Axial + torsional energy collection</text><text x="48" y="204" font-size="16">0.5 kWh delivered per cartridge</text><path class="l" d="M320 158 H370"/><rect class="b" x="370" y="80" width="275" height="155" rx="10"/><text x="388" y="112" font-size="20">10 independent output lanes</text><text x="388" y="145" font-size="16">20 cartridges selected sequentially</text><text x="388" y="173" font-size="16">Clutch + variable-ratio transmission</text><text x="388" y="204" font-size="16">10 kW per lane, 180 s per cartridge</text><path class="l" d="M645 158 H695"/><rect class="b" x="695" y="80" width="240" height="155" rx="10"/><text x="712" y="112" font-size="20">Common output shaft</text><text x="712" y="145" font-size="16">1,000 rpm target</text><text x="712" y="173" font-size="16">955 N m total output torque</text><text x="712" y="204" font-size="16">Reversible charging path</text><path class="l" d="M935 158 H985"/><text x="1000" y="150" font-size="24">100 kW</text><text x="1000" y="184" font-size="18">for 60 minutes</text><path class="l" d="M815 235 V285"/><rect class="b" x="695" y="285" width="355" height="65" rx="8"/><text x="710" y="312" font-size="17">Optional flywheel: 20 kJ usable buffer</text><text x="710" y="336" font-size="15">Bridges 0.2 s; additional hardware required</text><text x="30" y="392" font-size="17">Paper basis: Utsumi et al. (2024), Figure 6. Cartridge and transmission design are proposed extensions.</text><text x="30" y="425" font-size="16">Functional architecture only: no established pulley dimensions, rope count, gearbox ratio or total machine mass.</text></svg>