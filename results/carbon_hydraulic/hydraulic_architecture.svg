<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" fill="#f7fafc"/><style>text{font-family:Arial;fill:#17324a} .box{fill:#e1f2ed;stroke:#217a75;stroke-width:2} .line{stroke:#217a75;stroke-width:3;fill:none}</style><text x="35" y="38" font-size="25">Carbon tension storage — one of ten 10 kW lanes</text><rect class="box" x="35" y="85" width="250" height="100" rx="8"/><text x="55" y="120" font-size="19">20 × 500 m tension bundles</text><text x="55" y="152" font-size="16">Separate cylinders and hold latches</text><path class="line" d="M285 135 H355"/><rect class="box" x="355" y="85" width="220" height="100" rx="8"/><text x="373" y="120" font-size="19">Selection / isolation valves</text><text x="373" y="152" font-size="16">One bundle active for 180 s</text><path class="line" d="M575 135 H645"/><rect class="box" x="645" y="85" width="220" height="100" rx="8"/><text x="663" y="120" font-size="19">Variable-displacement</text><text x="663" y="152" font-size="16">hydraulic motor / pump</text><path class="line" d="M865 135 H925"/><text x="940" y="130" font-size="20">10 kW shaft</text><text x="940" y="158" font-size="16">1,000 rpm assumed</text><path class="line" d="M755 185 V275 H465 V185"/><rect class="box" x="520" y="240" width="175" height="75" rx="8"/><text x="535" y="270" font-size="17">Return tank / cooler</text><text x="535" y="295" font-size="14">Low-pressure circuit</text><text x="35" y="360" font-size="18">Discharge cylinder pressure: 300 → 90 bar. Charging reverses the power path.</text><text x="35" y="395" font-size="16">Functional schematic only. Accumulator, relief valves, detailed porting and switching dynamics remain to be sized.</text></svg>